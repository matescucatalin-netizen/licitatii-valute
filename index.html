<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Management Casă Schimb & Bănci</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .main-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 400px;
        }
        .box-full {
            flex: 1 1 100%;
        }
        h2 {
            color: #075E54;
            margin-top: 0;
            border-bottom: 2px solid #eef7f4;
            padding-bottom: 8px;
            font-size: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin: 12px 0 5px;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }
        .radio-option {
            background: #eef7f4;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #d1e7dd;
            cursor: pointer;
            font-weight: bold;
        }
        .radio-option input {
            width: auto;
            margin-right: 10px;
        }
        button {
            width: 100%;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-wa { background-color: #25D366; color: white; }
        .btn-wa:hover { background-color: #20ba5a; }
        .btn-calc { background-color: #007bff; color: white; }
        .btn-calc:hover { background-color: #0056b3; }
        .btn-save { background-color: #ffc107; color: #212529; }
        .btn-save:hover { background-color: #e0a800; }
        .flex-row {
            display: flex;
            gap: 10px;
        }
        .flex-row div {
            flex: 1;
        }
        .rezultat-calc {
            margin-top: 15px;
            padding: 12px;
            background: #eec;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">

    <div class="box">
        <h2>1. Trimite Mesaj Rapid WhatsApp</h2>
        
        <label>Selectează Acțiunea:</label>
        <div class="radio-group">
            <label class="radio-option">
                <input type="radio" name="tip_mesaj" value="Remite" id="radio_remite" checked onclick="toggleSectiuni()"> Remite
            </label>
            <label class="radio-option">
                <input type="radio" name="tip_mesaj" value="Pregateste" id="radio_pregateste" onclick="toggleSectiuni()"> Pregătește
            </label>
            <label class="radio-option">
                <input type="radio" name="tip_mesaj" value="Alerta" id="radio_alerta" onclick="toggleSectiuni()"> Alertă curs 🚨
            </label>
        </div>

        <div id="sectiune_principala_wa">
            <label for="sursa">Prima locație (De la):</label>
            <select id="sursa" onchange="salveazaDateWA()">
                <optgroup label="--- BĂNCI ---">
                    <option value="Hermes">Hermes</option>
                    <option value="Exim">Exim</option>
                </optgroup>
                <optgroup label="--- LOCAȚII / CENTRE ---">
                    <option value="Centru">Centru</option>
                    <option value="Locația 1">Locația 1</option>
                    <option value="Locația 2">Locația 2</option>
                    <option value="Locația 3">Locația 3</option>
                    <option value="Locația 4">Locația 4</option>
                    <option value="Locația 5">Locația 5</option>
                    <option value="Locația 6">Locația 6</option>
                    <option value="Locația 7">Locația 7</option>
                    <option value="Locația 8">Locația 8</option>
                </optgroup>
            </select>

            <label for="destinatie">A doua locație (Către):</label>
            <select id="destinatie" onchange="salveazaDateWA()">
                <optgroup label="--- BĂNCI ---">
                    <option value="Hermes">Hermes</option>
                    <option value="Exim">Exim</option>
                </optgroup>
                <optgroup label="--- LOCAȚII / CENTRE ---">
                    <option value="Centru" selected>Centru</option>
                    <option value="Locația 1">Locația 1</option>
                    <option value="Locația 2">Locația 2</option>
                    <option value="Locația 3">Locația 3</option>
                    <option value="Locația 4">Locația 4</option>
                    <option value="Locația 5">Locația 5</option>
                    <option value="Locația 6">Locația 6</option>
                    <option value="Locația 7">Locația 7</option>
                    <option value="Locația 8">Locația 8</option>
                </optgroup>
            </select>

            <div class="flex-row">
                <div>
                    <label for="suma">Sumă:</label>
                    <input type="number" id="suma" placeholder="0.00" oninput="salveazaDateWA()">
                </div>
                <div>
                    <label for="valuta">Valută:</label>
                    <select id="valuta" onchange="salveazaDateWA()">
                        <option value="RON">RON</option>
                        <option value="EUR">EUR</option>
                        <option value="USD">USD</option>
                        <option value="GBP">GBP</option>
                        <option value="CHF">CHF</option>
                        <option value="CAD">CAD</option>
                        <option value="AUD">AUD</option>
                        <option value="HUF">HUF</option>
                        <option value="BGN">BGN</option>
                        <option value="TRY">TRY</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="btn-wa" onclick="trimiteMesajComplet()">💬 Trimite direct pe WhatsApp</button>
    </div>

    <div class="box">
        <h2>2. Calculator Valutar Rapid</h2>
        
        <label for="calc_suma">Suma de schimbat:</label>
        <input type="number" id="calc_suma" placeholder="Introduceți suma" oninput="calculeazaSchimb()">
        
        <label for="calc_curs">Curs Valutar (Preț):</label>
        <input type="number" step="0.0001" id="calc_curs" placeholder="Ex: 4.9750" oninput="calculeazaSchimb()">
        
        <label for="calc_operatie">Operație:</label>
        <select id="calc_operatie" onchange="calculeazaSchimb()">
            <option value="inmultire">Suma × Curs (Ex: EUR în RON)</option>
            <option value="impartire">Suma ÷ Curs (Ex: RON în EUR)</option>
        </select>
        
        <div class="rezultat-calc" id="bloc_rezultat">Rezultat: 0.00</div>
    </div>

    <div class="box box-full">
        <h2>3. Agenda: Programări la Bănci și Notițe Operative</h2>
        <p style="font-size: 14px; color: #666; margin-top: -5px;">Notițele de mai jos rămân salvate automat în acest browser.</p>
        
        <textarea id="agenda_notiite" placeholder="Scrie aici programările la bănci (Ex: Hermes - ora 11:00 ridicare EUR, Exim - ora 14:00 depunere dosar)..." oninput="salveazaAgenda()"></textarea>
    </div>

</div>

<script>
    // AGENDA TELEFOANE WHATSAPP (Înlocuiește cu numerele reale, cu 40 în față)
    const agendaTelefoane = {
        "Hermes": "407XXXXXXXX",
        "Exim": "407XXXXXXXX",
        "Centru": "407XXXXXXXX",
        "Locația 1": "407XXXXXXXX",
        "Locația 2": "407XXXXXXXX",
        "Locația 3": "407XXXXXXXX",
        "Locația 4": "407XXXXXXXX",
        "Locația 5": "407XXXXXXXX",
        "Locația 6": "407XXXXXXXX",
        "Locația 7": "407XXXXXXXX",
        "Locația 8": "407XXXXXXXX"
    };

    window.onload = function() {
        incarcaToateDatele();
    };

    // Salvare și încărcare modul WhatsApp
    function readme() {}
    function salveazaDateWA() {
        localStorage.setItem('sursa', document.getElementById('sursa').value);
        localStorage.setItem('destinatie', document.getElementById('destinatie').value);
        localStorage.setItem('suma', document.getElementById('suma').value);
        localStorage.setItem('valuta', document.getElementById('valuta').value);
    }

    function toggleSectiuni() {
        const tipMesaj = document.querySelector('input[name="tip_mesaj"]:checked').value;
        localStorage.setItem('tip_mesaj', tipMesaj);
        
        const sectiunePrincipala = document.getElementById('sectiune_principala_wa');
        if (tipMesaj === 'Alerta') {
            sectiunePrincipala.style.display = 'none';
        } else {
            sectiunePrincipala.style.display = 'block';
        }
    }

    // Salvare modul Agendă Note
    function sample() {}
    function sample2() {}
    function salveazaAgenda() {
        localStorage.setItem('agenda_notiite', document.getElementById('agenda_notiite').value);
    }

    // Calculator valutar logică
    function calculeazaSchimb() {
        const suma = parseFloat(document.getElementById('calc_suma').value) || 0;
        const curs = parseFloat(document.getElementById('calc_curs').value) || 0;
        const operatie = document.getElementById('calc_operatie').value;
        let rezultat = 0;

        // Salvare valori calculator
        localStorage.setItem('calc_suma', document.getElementById('calc_suma').value);
        localStorage.setItem('calc_curs', document.getElementById('calc_curs').value);
        localStorage.setItem('calc_operatie', operatie);

        if (suma > 0 && curs > 0) {
            if (operatie === 'inmultire') {
                rezultat = suma * curs;
            } else {
                rezultat = suma / curs;
            }
            document.getElementById('bloc_rezultat').innerText = "Rezultat: " + rezultat.toFixed(2);
        } else {
            document.getElementById('bloc_rezultat').innerText = "Rezultat: 0.00";
        }
    }

    // Încarcă absolut tot la deschiderea paginii
    function incarcaToateDatele() {
        // WhatsApp
        const tipSalvat = localStorage.getItem('tip_mesaj') || 'Remite';
        if(tipSalvat === 'Remite') document.getElementById('radio_remite').checked = true;
        if(tipSalvat === 'Pregateste') document.getElementById('radio_pregateste').checked = true;
        if(tipSalvat === 'Alerta') document.getElementById('radio_alerta').checked = true;

        if(localStorage.getItem('sursa')) document.getElementById('sursa').value = localStorage.getItem('sursa');
        if(localStorage.getItem('destinatie')) document.getElementById('destinatie').value = localStorage.getItem('destinatie');
        if(localStorage.getItem('suma')) document.getElementById('suma').value = localStorage.getItem('suma');
        if(localStorage.getItem('valuta')) document.getElementById('valuta').value = localStorage.getItem('valuta');
        
        // Calculator
        if(localStorage.getItem('calc_suma')) document.getElementById('calc_suma').value = localStorage.getItem('calc_suma');
        if(localStorage.getItem('calc_curs')) document.getElementById('calc_curs').value = localStorage.getItem('calc_curs');
        if(localStorage.getItem('calc_operatie')) document.getElementById('calc_operatie').value = localStorage.getItem('calc_operatie');

        // Agendă
        if(localStorage.getItem('agenda_notiite')) document.getElementById('agenda_notiite').value = localStorage.getItem('agenda_notiite');

        toggleSectiuni();
        calculeazaSchimb();
    }

    // Trimitere text pe WhatsApp
    function trimiteMesajComplet() {
        const tipMesaj = document.querySelector('input[name="tip_mesaj"]:checked').value;
        const destinatie = document.getElementById('destinatie').value;
        let textMesaj = "";
        const numarTelefon = agendaTelefoane[destinatie] || "";

        if (tipMesaj === 'Alerta') {
            textMesaj = "🚨 *Alertă curs!*";
        } else {
            const sursa = document.getElementById('sursa').value;
            const suma = document.getElementById('suma').value;
            const valuta = document.getElementById('valuta').value;

            if(!suma) { alert("Te rog introdu suma!"); return; }

            if (tipMesaj === 'Remite') {
                textMesaj = `🏢 *Remitere*\n\n` +
                            `• *De la:* ${sursa}\n` +
                            `• *Către:* ${destinatie}\n` +
                            `• *Sumă:* ${suma}\n` +
                            `• *Valută:* ${valuta}\n\n` +
                            `Am trimis remiterea.`;
            } else if (tipMesaj === 'Pregateste') {
                textMesaj = `💰 *Pregătește sumă*\n\n` +
                            `• *Locație Sursă:* ${sursa}\n` +
                            `• *Locație Destinație:* ${destinatie}\n` +
                            `• *Sumă:* ${suma}\n` +
                            `• *Valută:* ${valuta}\n\n` +
                            `Te rog să pregătești această sumă.`;
            }
        }

        let urlWhatsApp = "";
        if(numarTelefon && numarTelefon !== "407XXXXXXXX") {
            urlWhatsApp = `https://api.whatsapp.com/send?phone=${numarTelefon}&text=` + encodeURIComponent(textMesaj);
        } else {
            urlWhatsApp = "https://api.whatsapp.com/send?text=" + encodeURIComponent(textMesaj);
        }
        window.open(urlWhatsApp, '_blank');
    }
</script>

</body>
</html>
