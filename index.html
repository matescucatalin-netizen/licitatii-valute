<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Mesaje WhatsApp - Extins</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 450px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #075E54;
            margin-top: 0;
        }
        label {
            font-weight: bold;
            display: block;
            margin: 12px 0 5px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .radio-option {
            background: #eef7f4;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #d1e7dd;
            cursor: pointer;
            font-weight: bold;
        }
        .radio-option input {
            width: auto;
            margin-right: 10px;
        }
        button {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover {
            background-color: #20ba5a;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mesaje Casă Schimb</h2>

    <label>Selectează Mesajul:</label>
    <div class="radio-group">
        <label class="radio-option">
            <input type="radio" name="tip_mesaj" value="Remite" id="radio_remite" onclick="salveazaSiIncarca()"> Remite
        </label>
        <label class="radio-option">
            <input type="radio" name="tip_mesaj" value="Pregateste" id="radio_pregateste" onclick="salveazaSiIncarca()"> Pregătește
        </label>
        <label class="radio-option">
            <input type="radio" name="tip_mesaj" value="Alerta" id="radio_alerta" onclick="salveazaSiIncarca()"> Alertă curs 🚨
        </label>
    </div>

    <div id="sectiune_date">
        <label for="sursa">Prima locație (De la):</label>
        <select id="sursa" onchange="salveazaDate()">
            <optgroup label="--- BĂNCI ---">
                <option value="Hermes">Hermes</option>
                <option value="Exim">Exim</option>
            </optgroup>
            <optgroup label="--- LOCAȚII / CENTRE ---">
                <option value="Centru">Centru</option>
                <option value="Locația 1">Locația 1</option>
                <option value="Locația 2">Locația 2</option>
                <option value="Locația 3">Locația 3</option>
                <option value="Locația 4">Locația 4</option>
                <option value="Locația 5">Locația 5</option>
                <option value="Locația 6">Locația 6</option>
                <option value="Locația 7">Locația 7</option>
                <option value="Locația 8">Locația 8</option>
            </optgroup>
        </select>

        <label for="destinatie">A doua locație (Către):</label>
        <select id="destinatie" onchange="salveazaDate()">
            <optgroup label="--- BĂNCI ---">
                <option value="Hermes">Hermes</option>
                <option value="Exim">Exim</option>
            </optgroup>
            <optgroup label="--- LOCAȚII / CENTRE ---">
                <option value="Centru" selected>Centru</option>
                <option value="Locația 1">Locația 1</option>
                <option value="Locația 2">Locația 2</option>
                <option value="Locația 3">Locația 3</option>
                <option value="Locația 4">Locația 4</option>
                <option value="Locația 5">Locația 5</option>
                <option value="Locația 6">Locația 6</option>
                <option value="Locația 7">Locația 7</option>
                <option value="Locația 8">Locația 8</option>
            </optgroup>
        </select>

        <label for="suma">Sumă:</label>
        <input type="number" id="suma" placeholder="Introduceți suma" oninput="salveazaDate()">

        <label for="valuta">Valută:</label>
        <select id="valuta" onchange="salveazaDate()">
            <option value="RON">RON</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
            <option value="CHF">CHF</option>
            <option value="CAD">CAD</option>
            <option value="AUD">AUD</option>
            <option value="HUF">HUF</option>
            <option value="BGN">BGN</option>
            <option value="TRY">TRY</option>
        </select>
    </div>

    <button onclick="trimitePeWhatsApp()">
        💬 Trimite pe WhatsApp
    </button>
</div>

<script>
    // Rulează automat când se deschide pagina
    window.onload = function() {
        incarcaDateSalvate();
    };

    function salveazaDate() {
        localStorage.setItem('sursa', document.getElementById('sursa').value);
        localStorage.setItem('destinatie', document.getElementById('destinatie').value);
        localStorage.setItem('suma', document.getElementById('suma').value);
        localStorage.setItem('valuta', document.getElementById('valuta').value);
    }

    function salveazaSiIncarca() {
        const tipMesaj = document.querySelector('input[name="tip_mesaj"]:checked').value;
        localStorage.setItem('tip_mesaj', tipMesaj);
        
        const sectiuneDate = document.getElementById('sectiune_date');
        if (tipMesaj === 'Alerta') {
            sectiuneDate.style.display = 'none';
        } else {
            sectiuneDate.style.display = 'block';
        }
    }

    function incarcaDateSalvate() {
        const tipSalvat = localStorage.getItem('tip_mesaj') || 'Remite';
        if(tipSalvat === 'Remite') document.getElementById('radio_remite').checked = true;
        if(tipSalvat === 'Pregateste') document.getElementById('radio_pregateste').checked = true;
        if(tipSalvat === 'Alerta') document.getElementById('radio_alerta').checked = true;

        if(localStorage.getItem('sursa')) document.getElementById('sursa').value = localStorage.getItem('sursa');
        if(localStorage.getItem('destinatie')) document.getElementById('destinatie').value = localStorage.getItem('destinatie');
        if(localStorage.getItem('suma')) document.getElementById('suma').value = localStorage.getItem('suma');
        if(localStorage.getItem('valuta')) document.getElementById('valuta').value = localStorage.getItem('valuta');

        salveazaSiIncarca();
    }

    function trimitePeWhatsApp() {
        const tipMesaj = document.querySelector('input[name="tip_mesaj"]:checked').value;
        let textMesaj = "";

        if (tipMesaj === 'Alerta') {
            textMesaj = "🚨 *Alertă curs!*";
        } else {
            const sursa = document.getElementById('sursa').value;
            const destinatie = document.getElementById('destinatie').value;
            const suma = document.getElementById('suma').value;
            const valuta = document.getElementById('valuta').value;

            if(!suma) { alert("Te rog introdu suma!"); return; }

            if (tipMesaj === 'Remite') {
                textMesaj = `🏢 *Remitere*\n\n` +
                            `• *De la:* ${sursa}\n` +
                            `• *Către:* ${destinatie}\n` +
                            `• *Sumă:* ${suma}\n` +
                            `• *Valută:* ${valuta}\n\n` +
                            `Am trimis remiterea.`;
            } else if (tipMesaj === 'Pregateste') {
                textMesaj = `💰 *Pregătește sumă*\n\n` +
                            `• *Locație Sursă:* ${sursa}\n` +
                            `• *Locație Destinație:* ${destinatie}\n` +
                            `• *Sumă:* ${suma}\n` +
                            `• *Valută:* ${valuta}\n\n` +
                            `Te rog să pregătești această sumă.`;
            }
        }

        const urlWhatsApp = "https://api.whatsapp.com/send?text=" + encodeURIComponent(textMesaj);
        window.open(urlWhatsApp, '_blank');
    }
</script>

</body>
</html>
