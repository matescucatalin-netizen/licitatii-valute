<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Mesaje WhatsApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #075E54;
            margin-top: 0;
        }
        label {
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .radio-option {
            background: #eef7f4;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #d1e7dd;
            cursor: pointer;
            font-weight: bold;
        }
        .radio-option input {
            width: auto;
            margin-right: 10px;
        }
        button {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover {
            background-color: #20ba5a;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mesaje Casă Schimb</h2>

    <!-- Pasul 1: Selectare Tip Mesaj -->
    <label>Selectează Mesajul:</label>
    <div class="radio-group">
        <label class="radio-option">
            <input type="radio" name="tip_mesaj" value="Remite" checked onclick="toggleFields()"> Remite
        </label>
        <label class="radio-option">
            <input type="radio" name="tip_mesaj" value="Pregateste" onclick="toggleFields()"> Pregătește
        </label>
        <label class="radio-option">
            <input type="radio" name="tip_mesaj" value="Alerta" onclick="toggleFields()"> Alertă curs 🚨
        </label>
    </div>

    <!-- Câmpuri dinamice care se ascund dacă e Alertă Curs -->
    <div id="sectiune_date">
        <!-- Pasul 2: Locații -->
        <label for="sursa">Prima locație (De la):</label>
        <select id="sursa">
            <option value="Hermes">Hermes</option>
            <option value="Exim">Exim</option>
            <option value="Centru">Centru</option>
        </select>

        <label for="destinatie">A doua locație (Către):</label>
        <select id="destinatie">
            <option value="Centru">Centru</option>
            <option value="Hermes">Hermes</option>
            <option value="Exim">Exim</option>
        </select>

        <!-- Pasul 3: Sumă și Valută -->
        <label for="suma">Sumă:</label>
        <input type="number" id="suma" placeholder="Introduceți suma">

        <label for="valuta">Valută:</label>
        <select id="valuta">
            <option value="EUR">EUR</option>
            <option value="RON">RON</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
        </select>
    </div>

    <!-- Buton Trimite -->
    <button onclick="trimitePeWhatsApp()">
        💬 Trimite pe WhatsApp
    </button>
</div>

<script>
    // Funcție care ascunde câmpurile dacă se alege "Alertă curs"
    function toggleFields() {
        const tipMesaj = document.querySelector('input[name="tip_mesaj"]:checked').value;
        const sectiuneDate = document.getElementById('sectiune_date');
        
        if (tipMesaj === 'Alerta') {
            sectiuneDate.style.display = 'none';
        } else {
            sectiuneDate.style.display = 'block';
        }
    }

    // Funcția principală care generează textul și deschide WhatsApp
    function trimitePeWhatsApp() {
        const tipMesaj = document.querySelector('input[name="tip_mesaj"]:checked').value;
        let textMesaj = "";

        if (tipMesaj === 'Alerta') {
            textMesaj = "🚨 *Alertă curs!*";
        } else if (tipMesaj === 'Remite') {
            const sursa = document.getElementById('sursa').value;
            const destinatie = document.getElementById('destinatie').value;
            const suma = document.getElementById('suma').value;
            const valuta = document.getElementById('valuta').value;

            if(!suma) { alert("Te rog introdu suma!"); return; }

            textMesaj = `🏢 *Remitere*\n\n` +
                        `• *De la:* ${sursa}\n` +
                        `• *Către:* ${destinatie}\n` +
                        `• *Sumă:* ${suma}\n` +
                        `• *Valută:* ${valuta}\n\n` +
                        `Am trimis remiterea.`;
        } else if (tipMesaj === 'Pregateste') {
            const sursa = document.getElementById('sursa').value;
            const destinatie = document.getElementById('destinatie').value;
            const suma = document.getElementById('suma').value;
            const valuta = document.getElementById('valuta').value;

            if(!suma) { alert("Te rog introdu suma!"); return; }

            textMesaj = `💰 *Pregătește sumă*\n\n` +
                        `• *Locație Sursă:* ${sursa}\n` +
                        `• *Locație Destinație:* ${destinatie}\n` +
                        `• *Sumă:* ${suma}\n` +
                        `• *Valută:* ${valuta}\n\n` +
                        `Te rog să pregătești această sumă.`;
        }

        // Codifică textul pentru link-ul de WhatsApp
        const urlWhatsApp = "https://api.whatsapp.com/send?text=" + encodeURIComponent(textMesaj);
        
        // Deschide WhatsApp
        window.open(urlWhatsApp, '_blank');
    }
</script>

</body>
</html>
