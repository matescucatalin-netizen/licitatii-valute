<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interfață Ultra-Compactă Puncte</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Oswald', sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding: 2px; font-size: 11px; }
    .header { padding-bottom: 2px; border-bottom: 2px solid #cbd5e1; margin-bottom: 4px; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: #0284c7; text-align: center; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .clock { font-size: 10px; color: #64748b; font-weight: bold; }
    
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: #16a34a; margin-bottom: 3px; border-left: 3px solid #16a34a; padding-left: 4px; }
    .section-container { background: #fff; padding: 2px; border-radius: 4px; border: 1px solid #cbd5e1; }

    /* LISTA ULTRA COMPACTĂ PENTRU O SINGURĂ MÂNĂ */
    .wa-list { display: flex; flex-direction: column; gap: 2px; }
    .wa-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px; display: flex; flex-direction: column; gap: 1px; }
    
    /* Rândul 1: Nume și toate butoanele de apel/comunicare */
    .wa-row-top { display: flex; align-items: center; gap: 2px; }
    .wa-name-box { width: 65px; font-size: 11px; font-weight: bold; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Butoane acțiuni rapide */
    .btn-action { border: none; border-radius: 3px; height: 22px; font-size: 11px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #fff; font-weight: bold; }
    .btn-call-normal { background: #0284c7; width: 24px; } /* Apel Normal */
    .btn-call-wa { background: #075e54; width: 30px; font-size: 10px; } /* Apel WhatsApp */
    .btn-send-wa { background: #25d366; flex: 1; min-width: 45px; font-size: 10px; gap: 1px; } /* Trimite text WA */
    
    /* Rândul 2: Sumă și Valută */
    .wa-row-mid { display: flex; gap: 2px; }
    .wa-inp-amount { flex: 2; padding: 2px; border: 1px solid #16a34a; border-radius: 3px; font-size: 11px; font-weight: bold; text-align: center; background: #f0fdf4; height: 22px; }
    .wa-sel { flex: 1; padding: 2px; border: 1px solid #94a3b8; border-radius: 3px; font-size: 10px; font-weight: bold; background: #fff; color: #334155; height: 22px; }
    .sel-curr { border-color: #0284c7; color: #0284c7; background: #f0f9ff; }

    /* Rândul 3: Tip Acțiune și Destinație (Inclusiv Bănci) */
    .wa-row-bottom { display: flex; gap: 2px; }
    .sel-action { border-color: #7c3aed; color: #7c3aed; background: #faf5ff; flex: 1.2; }
    .sel-dest { border-color: #b45309; color: #b45309; background: #fffbeb; flex: 1; }
  </style>
</head>
<body>

<div class="header">
  <div class="title">📱 REȚEA PUNCTE DE LUCRU</div>
  <div class="status-bar">
    <div class="clock" id="liveClock">--:--:--</div>
    <div class="clock">OPERARE O MÂNĂ</div>
  </div>
</div>

<div class="section-container">
  <div class="section-title">Panou Control Rapid</div>
  <div class="wa-list" id="wa-points-container">
    <!-- Generat dinamic prin JavaScript -->
  </div>
</div>

<script>
  // Doar punctele de lucru active, fără bănci în lista de bază
  const puncteLucru = [
    { name: "Hermes", phone: "0763706387" },
    { name: "Centru", phone: "0786157928" },
    { name: "Tic Tac", phone: "0760764377" },
    { name: "Bulevard", phone: "0783045102" },
    { name: "Dedeman", phone: "0787575821" },
    { name: "Lidl", phone: "0783074998" },
    { name: "Matei 1", phone: "0786157929" },
    { name: "Matei Mese", phone: "0746232090" }
  ];

  // Băncile și Alerta au fost mutate direct ca destinații de livrare/remitere sau acțiuni
  const destinatiiRemitere = [
    "Hermes", "Centru", "Tic Tac", "Bulevard", "Dedeman", "Lidl", "Matei 1", "Matei Mese",
    "Bancă CEC", "Bancă EXIM", "Altă Bancă"
  ];

  const valute = ["RON", "EUR", "USD", "GBP", "CHF", "CAD", "AUD", "HUF", "BGN", "TRY"];

  let htmlPuncte = "";
  
  puncteLucru.forEach((pt, index) => {
    const id = index + 1;
    
    // Generăm lista de destinații (excluzând punctul curent de pornire)
    let destOptions = `<option value="">➡️ Destinație</option>`;
    destinatiiRemitere.forEach(d => {
      if(d !== pt.name) destOptions += `<option value="${d}">${d}</option>`;
    });

    // Generăm opțiunile de valute
    let currOptions = valute.map(v => `<option value="${v}">${v}</option>`).join('');

    // Formatare număr internațional pentru link-uri de WhatsApp
    let waPhone = pt.phone;
    if (waPhone.startsWith('0')) waPhone = '4' + waPhone;

    htmlPuncte += `
    <div class="wa-item">
      <!-- RÂNDUL 1: NUME, APEL NORMAL, APEL WA, TRIMITE RAPID -->
      <div class="wa-row-top">
        <div class="wa-name-box">${pt.name}</div>
        <a href="tel:${pt.phone}" class="btn-action btn-call-normal" title="Apel Normal">📞</a>
        <a href="https://wa.me/${waPhone}?action=call" class="btn-action btn-call-wa" title="Apel WhatsApp">📞💬</a>
        <button class="btn-action btn-send-wa" onclick="sendPunctMsg(${id}, '${pt.name}', '${pt.phone}')">💬 Trimite</button>
      </div>
      
      <!-- RÂNDUL 2: INTRODUCERE SUMĂ ȘI VALUTĂ -->
      <div class="wa-row-mid">
        <input type="number" class="wa-inp-amount" id="amt_${id}" placeholder="Introduceți suma">
        <select class="wa-sel sel-curr" id="curr_${id}">${currOptions}</select>
      </div>
      
      <!-- RÂNDUL 3: TIP COMANDĂ ȘI DESTINATAR (INCLUSIV BĂNCI) -->
      <div class="wa-row-bottom">
        <select class="wa-sel sel-action" id="act_${id}" onchange="toggleActionFields(${id})">
          <option value="remite">🚚 Remite în...</option>
          <option value="remite_tot">💰 Remite TOT / Toate</option>
          <option value="pregateste_tot">🏦 Pregătește TOT / Toate</option>
          <option value="alerta">🚨 Alertă Curs Nou</option>
        </select>
        <select class="wa-sel sel-dest" id="dest_${id}">${destOptions}</select>
      </div>
    </div>`;
  });
  
  document.getElementById("wa-points-container").innerHTML = htmlPuncte;

  // Ascunde sau afișează selectorul de destinație dinamic pentru economie de spațiu pe ecran
  window.toggleActionFields = function(id) {
    const act = document.getElementById("act_" + id).value;
    const dest = document.getElementById("dest_" + id);
    
    if(act === "pregateste_tot" || act === "alerta") {
      dest.style.visibility = "hidden";
    } else {
      dest.style.visibility = "visible";
    }
  }

  // CONSTRUCTOR MESAJ TEXT WHATSAPP
  window.sendPunctMsg = function(id, nameOrigine, phoneOrigine) {
    const suma = document.getElementById("amt_" + id).value.trim();
    const valuta = document.getElementById("curr_" + id).value;
    const actiune = document.getElementById("act_" + id).value;
    const destinatie = document.getElementById("dest_" + id).value;

    let mesajulMeu = "";
    const txtSuma = suma ? `${suma} ${valuta}` : `stocul de ${valuta}`;
    
    if (actiune === "remite") {
      if(!destinatie) { alert("Selectați destinația (punct sau bancă)!"); return; }
      mesajulMeu = `Salut! Remite din ${nameOrigine} în *${destinatie}* valoarea de: *${txtSuma}*.`;
    } 
    else if (actiune === "remite_tot") {
      if(!destinatie) { alert("Selectați destinația pentru golirea stocului!"); return; }
      mesajulMeu = `Salut! Remite *TOT / TOATE* stocurile de *${valuta}* din ${nameOrigine} către *${destinatie}*.`;
    }
    else if (actiune === "pregateste_tot") {
      mesajulMeu = `Salut! Pregătește *TOT / TOATE* lirele/usd/chf/stocurile de *${valuta}* la punctul ${nameOrigine}.`;
      if(suma) mesajulMeu += ` Sumă estimată: ${suma} ${valuta}.`;
    } 
    else if (actiune === "alerta") {
      const nivel = suma ? `la nivelul de ${suma}` : "";
      mesajulMeu = `🚨 *ALERTĂ CURS* ${nameOrigine}! S-a modificat prețul pentru *${valuta}* ${nivel}. Modificați în sistem!`;
    }

    let targetPhone = phoneOrigine ? phoneOrigine : "";
    if (targetPhone.startsWith('0')) targetPhone = '4' + targetPhone;

    const url = "https://api.whatsapp.com/send?phone=" + encodeURIComponent(targetPhone) + "&text=" + encodeURIComponent(mesajulMeu);
    window.open(url, '_blank');
  };

  // Ceas Live în colț
  setInterval(() => { document.getElementById("liveClock").innerText = new Date().toLocaleTimeString("ro-RO"); }, 1000);
</script>
</body>
</html>
